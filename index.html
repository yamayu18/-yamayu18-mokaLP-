<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>百花ゼロジェル LP</title>
    <style>
      :root {
        --page-width: 390px;
        --page-bg: #f6f3eb;
        --frame-bg: #ffffff;
        --frame-shadow: 0 20px 50px rgba(84, 66, 35, 0.14);
        --purchase-url: "https://www.hyakka-market.com/product-detail.html";
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(180deg, #f8f7f1 0%, #efe9dd 100%);
        color: #222;
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      }

      body {
        min-height: 100vh;
        padding-bottom: 108px;
      }

      .lp {
        width: var(--page-width);
        margin: 0 auto;
        background: var(--frame-bg);
        box-shadow: var(--frame-shadow);
      }

      .lp-section {
        position: relative;
        display: block;
      }

      .lp-section img {
        display: block;
        width: 100%;
        height: auto;
      }

      .cta-link {
        position: absolute;
        display: block;
        z-index: 1;
        border-radius: 999px;
        transition:
          transform 220ms ease,
          box-shadow 220ms ease,
          filter 220ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .cta-link::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.08));
        opacity: 0.18;
        transform: scale(1);
        transform-origin: center;
        transition:
          transform 220ms ease,
          opacity 220ms ease,
          box-shadow 220ms ease,
          filter 220ms ease;
        pointer-events: none;
      }

      .cta-link::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: inherit;
        border: 2px solid rgba(255, 255, 255, 0.52);
        box-shadow:
          0 0 0 1px rgba(109, 154, 57, 0.12),
          0 10px 22px rgba(62, 122, 45, 0.12);
        opacity: 0;
        transform: scale(1);
        transform-origin: center;
        transition:
          transform 220ms ease,
          opacity 220ms ease,
          box-shadow 220ms ease;
        pointer-events: none;
      }

      .section-a .cta-link {
        left: 34.9%;
        top: 89.7%;
        width: 57.6%;
        height: 6.1%;
      }

      .section-d .cta-link {
        left: 52.4%;
        top: 96.05%;
        width: 44.8%;
        height: 2.55%;
      }

      .section-g .cta-link-secondary {
        position: absolute;
        left: 2.9%;
        top: 82.0%;
        width: 93.2%;
        height: 13.3%;
        display: block;
        z-index: 1;
      }

      .sub-cta {
        box-shadow: 0 8px 18px rgba(78, 120, 42, 0.18);
      }

      .main-cta {
        box-shadow: 0 10px 24px rgba(61, 122, 45, 0.18);
      }

      .sub-cta::before {
        opacity: 0.58;
        box-shadow:
          0 12px 24px rgba(61, 122, 45, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.24);
        animation: cta-soft-pulse 1.95s ease-in-out infinite;
      }

      .sub-cta::after {
        opacity: 0.42;
        animation: cta-soft-ring-pulse 1.95s ease-in-out infinite;
      }

      .main-cta::before {
        opacity: 0.98;
        box-shadow:
          0 18px 34px rgba(61, 122, 45, 0.26),
          0 0 0 1px rgba(255, 255, 255, 0.36),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        animation: cta-pulse 1.75s ease-in-out infinite;
      }

      .main-cta::after {
        opacity: 0.88;
        animation: cta-ring-pulse 1.75s ease-in-out infinite;
      }

      .section-a .sub-cta::before,
      .section-a .sub-cta::after {
        animation-delay: 0.2s;
      }

      .section-g .sub-cta::before,
      .section-g .sub-cta::after {
        animation-delay: 0.8s;
      }

      .cta-link:hover::before,
      .cta-link:focus-visible::before {
        opacity: 0.9;
        transform: scale(1.025);
        box-shadow:
          0 16px 30px rgba(61, 122, 45, 0.24),
          0 0 0 1px rgba(255, 255, 255, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        filter: saturate(1.04);
        outline: none;
      }

      .cta-link:hover::after,
      .cta-link:focus-visible::after {
        opacity: 0.96;
        transform: scale(1.03);
        box-shadow:
          0 0 0 2px rgba(145, 193, 75, 0.18),
          0 16px 30px rgba(61, 122, 45, 0.24);
      }

      .cta-link:active::before {
        transform: scale(1.015);
      }

      .cta-link:active::after {
        transform: scale(1.018);
      }

      @keyframes cta-pulse {
        0%,
        100% {
          opacity: 0.84;
          transform: scale(1);
          box-shadow:
            0 14px 28px rgba(61, 122, 45, 0.24),
            0 0 0 1px rgba(255, 255, 255, 0.28),
            inset 0 1px 0 rgba(255, 255, 255, 0.24);
        }

        50% {
          opacity: 1;
          transform: scale(1.085);
          box-shadow:
            0 26px 48px rgba(61, 122, 45, 0.44),
            0 0 0 2px rgba(255, 255, 255, 0.42),
            inset 0 1px 0 rgba(255, 255, 255, 0.36);
        }
      }

      @keyframes cta-soft-pulse {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(1);
          box-shadow:
            0 10px 20px rgba(61, 122, 45, 0.14),
            0 0 0 1px rgba(255, 255, 255, 0.2),
            inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        50% {
          opacity: 0.9;
          transform: scale(1.055);
          box-shadow:
            0 18px 30px rgba(61, 122, 45, 0.28),
            0 0 0 1px rgba(255, 255, 255, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }
      }

      @keyframes cta-ring-pulse {
        0%,
        100% {
          opacity: 0.68;
          transform: scale(1);
          box-shadow:
            0 0 0 1px rgba(145, 193, 75, 0.16),
            0 12px 24px rgba(62, 122, 45, 0.18);
        }

        50% {
          opacity: 1;
          transform: scale(1.075);
          box-shadow:
            0 0 0 5px rgba(145, 193, 75, 0.24),
            0 22px 38px rgba(62, 122, 45, 0.34);
        }
      }

      @keyframes cta-soft-ring-pulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(1);
          box-shadow:
            0 0 0 1px rgba(145, 193, 75, 0.1),
            0 10px 20px rgba(62, 122, 45, 0.12);
        }

        50% {
          opacity: 0.72;
          transform: scale(1.045);
          box-shadow:
            0 0 0 3px rgba(145, 193, 75, 0.18),
            0 16px 28px rgba(62, 122, 45, 0.22);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cta-link {
          transition: none;
        }

        .cta-link::before {
          transition: none;
        }

        .cta-link::after {
          transition: none;
        }

        .main-cta::before {
          animation: none;
        }

        .main-cta::after {
          animation: none;
        }

        .sub-cta::before,
        .sub-cta::after {
          animation: none;
        }
      }

      .lp-footer {
        padding: 20px 18px 28px;
        background: #f7f4ed;
        border-top: 1px solid rgba(129, 113, 76, 0.18);
      }

      .lp-footer-nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 0;
        margin: 0;
      }

      .lp-footer-nav + .lp-footer-nav {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(129, 113, 76, 0.18);
      }

      .lp-footer-link {
        color: #305d34;
        font-size: 12px;
        line-height: 1.6;
        text-decoration: none;
        white-space: nowrap;
      }

      .lp-footer-link:hover {
        text-decoration: underline;
      }

      .lp-footer-separator {
        margin: 0 6px;
        color: #8e8368;
        font-size: 12px;
        line-height: 1.6;
      }

      .fixed-cta-banner {
        display: none;
      }

      @media (max-width: 767px) {
        .fixed-cta-banner {
          position: fixed;
          left: 50%;
          bottom: 12px;
          z-index: 9999;
          padding: 0;
          margin: 0;
          background: transparent;
          border: none;
          box-shadow: none;
          width: min(calc(100vw - 24px), var(--page-width));
          aspect-ratio: 3.45 / 1;
          height: auto;
          min-height: 0;
          max-height: 18vh;
          transform: translateX(-50%);
          display: block;
        }
      }

      .fixed-cta-banner a {
        display: block;
        padding: 0;
        margin: 0;
        line-height: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 18px;
      }

      .fixed-cta-banner img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center 50%;
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        transform: scale(1);
        transform-origin: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .fixed-cta-banner img {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="lp">
      <section class="lp-section section-a" id="product">
        <img src="./images/a.png" alt="百花ゼロジェル メインビジュアル" />
        <a
          class="cta-link sub-cta"
          href="https://www.hyakka-market.com/product-detail.html"
          aria-label="商品詳細ページへ移動"
        ></a>
      </section>
      <section class="lp-section">
        <img src="./images/b.png" alt="お口の悩み" />
      </section>
      <section class="lp-section">
        <img src="./images/c.png" alt="ピリピリ感に関する調査" />
      </section>
      <section class="lp-section section-d" id="clinic">
        <img src="./images/d.png" alt="国内工場と品質試験" />
        <a
          class="cta-link main-cta"
          href="https://www.hyakka-market.com/product-detail.html"
          aria-label="商品詳細ページへ移動"
        ></a>
      </section>
      <section class="lp-section">
        <img src="./images/e.png" alt="ランキングとレビュー" />
      </section>
      <section class="lp-section">
        <img src="./images/f.png" alt="ランキングとレビュー" />
      </section>
      <section class="lp-section section-g" id="concept">
        <img src="./images/g.png" alt="選ばれる理由" />
        <a
          class="cta-link cta-link-secondary sub-cta"
          href="https://www.hyakka-market.com/product-detail.html"
          aria-label="商品詳細ページへ移動"
        ></a>
      </section>
      <section class="lp-section">
        <img src="./images/h.png" alt="使い方とよくある質問" />
      </section>
      <footer class="lp-footer">
        <nav class="lp-footer-nav" aria-label="LPフッターナビゲーション">
          <a class="lp-footer-link" href="#product">商品紹介</a>
          <span class="lp-footer-separator">|</span>
          <a class="lp-footer-link" href="#clinic">クリニック紹介</a>
          <span class="lp-footer-separator">|</span>
          <a class="lp-footer-link" href="#concept">コンセプト・私たちの思い</a>
          <span class="lp-footer-separator">|</span>
          <a class="lp-footer-link" href="https://www.hyakka-market.com/contact.html">お問い合わせ</a>
        </nav>
        <nav class="lp-footer-nav" aria-label="法務リンク">
          <a class="lp-footer-link" href="https://www.hyakka-market.com/legal-notice.html">特定商取引法に基づく表記</a>
          <span class="lp-footer-separator">|</span>
          <a class="lp-footer-link" href="https://www.hyakka-market.com/terms-of-service.html">利用規約</a>
          <span class="lp-footer-separator">|</span>
          <a class="lp-footer-link" href="https://www.hyakka-market.com/privacy-policy.html">プライバシーポリシー</a>
        </nav>
      </footer>
    </main>
    <aside class="fixed-cta-banner" aria-label="固定購入バナー">
      <a
        href="https://www.hyakka-market.com/product-detail.html"
        aria-label="百花ゼロジェルの購入ページへ移動"
      >
        <img src="./images/fixed-banner.png" alt="百花ゼロジェル 固定CTAバナー" />
      </a>
    </aside>
  </body>
</html>
